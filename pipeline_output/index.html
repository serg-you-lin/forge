<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>DXF Pipeline Viewer</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #fafafa;
}

h1 {
    margin-bottom: 10px;
}

input[type="file"] {
    margin-bottom: 15px;
}

table {
    border-collapse: collapse;
    width: 100%;
    font-size: 14px;
    background: white;
}

th, td {
    border: 1px solid #ddd;
    padding: 6px;
    text-align: left;
    vertical-align: top;
}

th {
    background: #f2f2f2;
    cursor: pointer;
    position: relative;
}

th:hover {
    background: #e6e6e6;
}

.filter-input {
    width: 95%;
    margin-top: 4px;
    font-size: 12px;
}

.badge {
    display: inline-block;
    padding: 2px 6px;
    font-size: 11px;
    border-radius: 8px;
    background: #cc0000;
    color: white;
    font-weight: bold;
}

.row-error {
    background-color: rgba(255, 0, 0, 0.08);
}

.row-warning {
    background-color: rgba(255, 200, 0, 0.15);
}

.row-ok {
    background-color: rgba(0, 180, 0, 0.08);
}
</style>
</head>

<body>

<h1>DXF Pipeline Report</h1>

<input type="file" id="fileInput" accept=".json">

<table>
<thead>
<tr>
    <th data-key="file">File<br><input class="filter-input" data-key="file"></th>
    <th data-key="status">Status<br><input class="filter-input" data-key="status"></th>
    <th data-key="parts">Parts<br><input class="filter-input" data-key="parts"></th>
    <th data-key="warnings">Warnings</th>
    <th data-key="errors">Errors</th>
    <th data-key="area">Area<br><input class="filter-input" data-key="area"></th>
    <th data-key="holes">Holes<br><input class="filter-input" data-key="holes"></th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>

<script>

let jsonData = [];
let currentSortKey = null;
let sortAsc = true;
let filters = {};

document.getElementById("fileInput").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        jsonData = JSON.parse(e.target.result);
        render();
    };
    reader.readAsText(file);
});

document.querySelectorAll(".filter-input").forEach(input => {
    input.addEventListener("input", function() {
        filters[this.dataset.key] = this.value.toLowerCase();
        render();
    });
});

document.querySelectorAll("th[data-key]").forEach(header => {
    header.addEventListener("click", function() {
        const key = this.dataset.key;
        if (currentSortKey === key) {
            sortAsc = !sortAsc;
        } else {
            currentSortKey = key;
            sortAsc = true;
        }
        render();
    });
});

function getRowStatus(item) {

    if (item.errors && item.errors.length > 0) return "error";

    const hasMaterialWarning = item.warnings.some(w =>
        w.toLowerCase().includes("materiale non specificato") ||
        w.toLowerCase().includes("spessore non specificato")
    );

    if (hasMaterialWarning) return "warning";

    return "ok";
}

function getValue(item, key) {

    if (key === "area")
        return item.metadata?.[0]?.area ?? "";

    if (key === "holes")
        return item.metadata?.[0]?.holes_count ?? "";

    return item[key] ?? "";
}

function render() {

    let data = [...jsonData];

    // Apply filters
    data = data.filter(item => {
        return Object.keys(filters).every(key => {
            if (!filters[key]) return true;
            const value = String(getValue(item, key)).toLowerCase();
            return value.includes(filters[key]);
        });
    });

    // Sorting
    if (currentSortKey) {
        data.sort((a, b) => {
            let valA = getValue(a, currentSortKey);
            let valB = getValue(b, currentSortKey);

            if (!isNaN(valA) && !isNaN(valB)) {
                valA = Number(valA);
                valB = Number(valB);
            }

            if (valA < valB) return sortAsc ? -1 : 1;
            if (valA > valB) return sortAsc ? 1 : -1;
            return 0;
        });
    }

    const tbody = document.getElementById("table-body");
    tbody.innerHTML = "";

    data.forEach(item => {

        const row = document.createElement("tr");
        const statusType = getRowStatus(item);

        if (statusType === "error") row.classList.add("row-error");
        else if (statusType === "warning") row.classList.add("row-warning");
        else row.classList.add("row-ok");

        const area = getValue(item, "area");
        const holes = getValue(item, "holes");

        row.innerHTML = `
            <td>${item.file}</td>
            <td>${item.status}</td>
            <td>${item.parts}</td>
            <td>${item.warnings.join("<br>")}</td>
            <td>
                ${item.errors.length > 0 ? 
                    `<span class="badge">${item.errors.length}</span><br>${item.errors.join("<br>")}` 
                    : ""}
            </td>
            <td>${area}</td>
            <td>${holes}</td>
        `;

        tbody.appendChild(row);
    });
}

</script>

</body>
</html>
