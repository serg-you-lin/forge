<title>Forge View Model</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/*
  Single visual world by design: a CAD model-space viewport. Professional CAD
  (AutoCAD model space, LibreCAD, the ezdxf viewer, KiCad) is dark because thin
  bright vector strokes only read on a dark ground — a light theme would fight
  the subject. Every colour is still declared explicitly so the page holds on
  any host ground.
*/
:root {
  --ground:        #0b0e12;
  --panel:         #12171e;
  --panel-raised:  #1a212b;
  --edge:          #29323d;
  --edge-bright:   #3b4754;
  --ink:           #d6dde4;
  --ink-dim:       #8a95a2;
  --ink-faint:     #59636f;
  --amber:         #eea23c;
  --amber-soft:    rgba(238, 162, 60, 0.14);
  --grid-fine:     rgba(120, 140, 165, 0.055);
  --grid-coarse:   rgba(120, 140, 165, 0.13);
  --bad:           #ff6b6b;

  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", var(--sans);

  --rail: 284px;
  --bar: 46px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.label {
  font-family: var(--cond);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  font-size: 11px;
  color: var(--ink-faint);
}

button {
  font: inherit;
  color: var(--ink-dim);
  background: var(--panel-raised);
  border: 1px solid var(--edge);
  border-radius: 3px;
  padding: 5px 9px;
  cursor: pointer;
  transition: border-color .12s, color .12s, background .12s;
}
button:hover { color: var(--ink); border-color: var(--edge-bright); }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
button.on { color: var(--ground); background: var(--amber); border-color: var(--amber); }

/* ---------- shell ---------- */

.app { display: grid; grid-template-rows: var(--bar) 1fr; height: 100%; }

.bar {
  display: flex; align-items: center; gap: 16px;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--edge);
  z-index: 3;
}

.wordmark { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.wordmark b {
  font-family: var(--mono); font-weight: 500; font-size: 14px;
  color: var(--ink); letter-spacing: -0.01em;
}
.wordmark span {
  font-family: var(--cond); font-weight: 600; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.14em; color: var(--amber);
}

.bar .file {
  font-family: var(--mono); font-size: 12px; color: var(--ink-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bar .grow { flex: 1; }
.bar .readout {
  font-family: var(--mono); font-size: 12px; color: var(--ink-dim);
  font-variant-numeric: tabular-nums; min-width: 62px; text-align: right;
}

.parts { display: flex; gap: 4px; }
.parts button { padding: 4px 8px; font-family: var(--mono); font-size: 11.5px; }

/* ---------- body ---------- */

.body { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 0; }

.rail {
  background: var(--panel);
  border-right: 1px solid var(--edge);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.rail::-webkit-scrollbar { width: 10px; }
.rail::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 5px; border: 2px solid var(--panel); }

.group { padding: 14px; border-bottom: 1px solid var(--edge); }
.group > .label { display: block; margin-bottom: 10px; }

.samples { display: flex; flex-direction: column; gap: 4px; }
.samples button { text-align: left; font-family: var(--mono); font-size: 12px; }
.samples button.on { color: var(--ground); }

.rowbtn { width: 100%; margin-top: 8px; }

/* layer + display toggle rows */
.toggle {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 6px 7px;
  border: 1px solid transparent; border-radius: 3px;
  background: none; color: var(--ink-dim); cursor: pointer;
  transition: background .12s, color .12s;
}
.toggle:hover { background: var(--panel-raised); color: var(--ink); }
.toggle:focus-visible { outline: 2px solid var(--amber); outline-offset: -1px; }
.toggle[aria-pressed="false"] { color: var(--ink-faint); }
.toggle[aria-pressed="false"] .swatch { opacity: 0.25; }
.toggle[aria-pressed="false"] .box { background: none; }

.swatch { width: 11px; height: 11px; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset; }
.toggle .name { flex: 1; text-align: left; text-transform: capitalize; }
.toggle .count { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.box {
  width: 13px; height: 13px; flex: none; border-radius: 2px;
  border: 1px solid var(--edge-bright); background: var(--amber);
  display: grid; place-items: center;
}
.box svg { width: 9px; height: 9px; stroke: var(--ground); stroke-width: 2.4; fill: none; }

.stats { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); line-height: 1.7; }
.stats div { display: flex; justify-content: space-between; gap: 12px; }
.stats span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
.stats .warn { color: var(--amber); }
.stats .err { color: var(--bad); }

/* ---------- canvas ---------- */

.stage { position: relative; overflow: hidden; background: var(--ground); }
#viewport { position: absolute; inset: 0; display: block; touch-action: none; cursor: grab; }
#viewport.drag { cursor: grabbing; }

#grid line.f { stroke: var(--grid-fine); }
#grid line.c { stroke: var(--grid-coarse); }
#overlay text { fill: var(--ink-dim); font-family: var(--mono); }

.corner {
  position: absolute; font-family: var(--mono); font-size: 11px;
  color: var(--ink-faint); pointer-events: none; user-select: none;
  background: var(--ground);
}
#coords { left: 12px; bottom: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; padding: 3px 7px; border: 1px solid var(--edge); border-radius: 3px; }
#coords b { color: var(--amber); font-weight: 500; }
#hint { right: 12px; bottom: 11px; }

.tip {
  position: absolute; z-index: 5; pointer-events: none;
  min-width: 132px; max-width: 240px;
  background: var(--panel-raised); border: 1px solid var(--edge-bright);
  border-radius: 4px; padding: 8px 10px;
  box-shadow: 0 8px 26px rgba(0,0,0,.5);
  opacity: 0; transform: translateY(3px); transition: opacity .09s, transform .09s;
}
.tip.show { opacity: 1; transform: none; }
.tip .k {
  font-family: var(--cond); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; font-size: 10.5px; color: var(--tipc, var(--amber));
  display: flex; align-items: center; gap: 6px;
}
.tip .k .swatch { width: 9px; height: 9px; }
.tip dl { margin-top: 6px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.tip dt { font-size: 11px; color: var(--ink-faint); }
.tip dd { font-family: var(--mono); font-size: 11px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- paste sheet ---------- */

.sheet {
  position: absolute; inset: 0; z-index: 10;
  background: rgba(6, 9, 12, 0.72);
  display: none; place-items: center; padding: 24px;
}
.sheet.open { display: grid; }
.card {
  width: min(620px, 100%); background: var(--panel);
  border: 1px solid var(--edge-bright); border-radius: 6px; padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.card h2 { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; color: var(--ink); }
.card p { font-size: 12px; color: var(--ink-dim); }
.card code { font-family: var(--mono); color: var(--amber); font-size: 11.5px; }
textarea {
  font-family: var(--mono); font-size: 12px; line-height: 1.5;
  background: var(--ground); color: var(--ink);
  border: 1px solid var(--edge); border-radius: 4px; padding: 10px;
  min-height: 220px; resize: vertical; width: 100%;
}
textarea:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.card .actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.card .msg { margin-right: auto; font-size: 11.5px; color: var(--bad); font-family: var(--mono); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

@media (max-width: 720px) {
  :root { --rail: 100%; }
  .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { max-height: 42vh; border-right: none; border-bottom: 1px solid var(--edge); }
  .bar .file { display: none; }
}
</style>

<div class="app">
  <header class="bar">
    <div class="wordmark"><b>forge</b><span>view&nbsp;model</span></div>
    <div class="parts" id="parts"></div>

    <button id="fit" title="Fit to view (F / double-click)">Fit</button>

  <div class="body">

      <div class="group">

      <div class="group">

            <button id="cancel">Cancel</button>
            <button id="load" class="on">Load</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const SAMPLES = JSON.parse(document.getElementById("samples-data").textContent);
  const NS = "http://www.w3.org/2000/svg";

  // forge emits ACI-derived hex; a couple are too dark on the viewport ground.
  const TWEAK = { "#0000ff": "#5b7cff", "#808080": "#9aa2ab" };
  const fix = c => TWEAK[String(c).toLowerCase()] || c;

  const el = id => document.getElementById(id);
  const svg = el("viewport"), scene = el("scene"), gridG = el("grid"), overlay = el("overlay");
  const stage = el("stage"), tip = el("tip"), coords = el("coords");

  const state = {
    name: null,
    vm: null,
    view: { tx: 0, ty: 0, s: 1 },
    hidden: new Set(),
    part: "all",
    opts: { trash: true, annotations: true, circles: true, grid: true },
  };

  const ROLE_ORDER = ["outer", "inner", "hole", "countersink", "threaded_hole",
                      "bending", "engrave", "marking", "frame", "unknown"];

  // ---------- geometry helpers ----------

  function pathD(points, closed) {
    if (!points || points.length < 2) return "";
    let d = "M" + points[0][0].toFixed(3) + " " + points[0][1].toFixed(3);
    for (let i = 1; i < points.length; i++)
      d += "L" + points[i][0].toFixed(3) + " " + points[i][1].toFixed(3);
    return closed ? d + "Z" : d;
  }

  // every drawable feature of the current view model, flattened
  function features(vm) {
    const out = [];
    const parts = state.part === "all" ? vm.parts
                : [vm.parts[+state.part]].filter(Boolean);
    parts.forEach((p, pi) => {
      const tag = vm.parts.length > 1 ? ` · ${p.label || "part " + pi}` : "";
      out.push({ ...p.outer, kind: "outer", meta: { part: p.label }, tag });
      p.inners.forEach(c => out.push({ ...c, kind: "inner", tag }));
      p.holes.forEach(h => out.push({ ...h, kind: "hole", tag }));
      p.bending_lines.forEach(b => out.push({ ...b, kind: "bending", tag }));
      p.engrave_lines.forEach(e => out.push({ ...e, kind: "engrave", tag }));
    });
    if (state.opts.trash) (vm.trash || []).forEach(t => out.push({ ...t, kind: "trash", tag: "" }));
    return out;
  }

  function computeBBox(vm) {
    if (vm.bbox && state.part === "all") return vm.bbox;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const f of features(vm))
      for (const [x, y] of f.points || []) {
        if (x < x0) x0 = x; if (y < y0) y0 = y;
        if (x > x1) x1 = x; if (y > y1) y1 = y;
      }
    return isFinite(x0) ? [x0, y0, x1, y1] : [0, 0, 100, 100];
  }

  // ---------- scene ----------

  function buildScene() {
    scene.textContent = "";
    const vm = state.vm;
    const groups = {};
    const roleGroup = role => {
      if (!groups[role]) {
        const g = document.createElementNS(NS, "g");
        g.dataset.role = role;
        g.style.display = state.hidden.has(role) ? "none" : "";
        groups[role] = g;
        scene.appendChild(g);
      }
      return groups[role];
    };

    for (const f of features(vm)) {
      const role = f.role || "unknown";
      const g = roleGroup(role);
      const stroke = fix(f.color || "#ff0000");
      let node;

      if (f.kind === "hole" && state.opts.circles && f.diameter > 0 && f.center) {
        node = document.createElementNS(NS, "circle");
        node.setAttribute("cx", f.center[0]);
        node.setAttribute("cy", f.center[1]);
        node.setAttribute("r", f.diameter / 2);
      } else {
        node = document.createElementNS(NS, "path");
        node.setAttribute("d", pathD(f.points, f.closed));
      }
      node.setAttribute("fill", "none");
      node.setAttribute("stroke", stroke);
      node.setAttribute("stroke-width", role === "outer" ? 1.7 : 1.3);
      node.setAttribute("vector-effect", "non-scaling-stroke");
      node.setAttribute("stroke-linejoin", "round");
      node.style.cursor = "crosshair";
      node.__f = f;
      node.addEventListener("pointerenter", showTip);
      node.addEventListener("pointerleave", hideTip);
      g.appendChild(node);
    }
    // deterministic paint order
    ROLE_ORDER.forEach(r => groups[r] && scene.appendChild(groups[r]));
    applyView();
  }

  // ---------- view transform ----------

  function applyView() {
    const { tx, ty, s } = state.view;
    scene.setAttribute("transform", `translate(${tx} ${ty}) scale(${s} ${-s})`);
    el("zoom").textContent = Math.round(s * 100 * fitRatio) + "%";
    drawGrid();
    drawOverlay();
  }

  let fitRatio = 1; // so the % readout reads 100% at the fitted zoom

  let fitted = false;

  function fit() {
    const R = svg.getBoundingClientRect();
    if (R.width < 8 || R.height < 8) { fitted = false; return; } // layout not ready
    const [x0, y0, x1, y1] = computeBBox(state.vm);
    const w = Math.max(x1 - x0, 1e-6), h = Math.max(y1 - y0, 1e-6);
    const m = 26;
    const s = Math.max(1e-4, Math.min((R.width - 2 * m) / w, (R.height - 2 * m) / h));
    state.view.s = s;
    state.view.tx = (R.width - s * (x0 + x1)) / 2;
    state.view.ty = (R.height + s * (y0 + y1)) / 2; // + because y is flipped
    fitRatio = 1 / s;
    fitted = true;
    applyView();
  }

  function zoomAt(px, py, factor) {
    const v = state.view;
    const ns = Math.max(1e-4, Math.min(v.s * factor, 5e6));
    const mx = (px - v.tx) / v.s;
    const my = (py - v.ty) / -v.s;
    v.s = ns;
    v.tx = px - mx * v.s;
    v.ty = py + my * v.s;
    applyView();
  }

  // ---------- grid ----------

  function niceStep(px, s) {
    const target = px / s;                       // model units for ~px screen px
    const p = Math.pow(10, Math.floor(Math.log10(target)));
    for (const m of [1, 2, 5, 10]) if (p * m >= target) return p * m;
    return p * 10;
  }

  function drawGrid() {
    gridG.textContent = "";
    if (!state.opts.grid) return;
    const R = svg.getBoundingClientRect();
    const { tx, ty, s } = state.view;
    const step = niceStep(64, s);
    const toSX = x => tx + s * x;
    const toSY = y => ty - s * y;
    const x0 = (0 - tx) / s, x1 = (R.width - tx) / s;
    const y1 = (ty - 0) / s, y0 = (ty - R.height) / s;

    const line = (x1v, y1v, x2v, y2v, cls) => {
      const l = document.createElementNS(NS, "line");
      l.setAttribute("x1", x1v); l.setAttribute("y1", y1v);
      l.setAttribute("x2", x2v); l.setAttribute("y2", y2v);
      l.setAttribute("class", cls);
      l.setAttribute("stroke-width", 1);
      gridG.appendChild(l);
    };
    const start = Math.floor(x0 / step) * step;
    for (let x = start; x <= x1; x += step)
      line(toSX(x), 0, toSX(x), R.height, Math.round(x / step) % 5 === 0 ? "c" : "f");
    const starty = Math.floor(y0 / step) * step;
    for (let y = starty; y <= y1; y += step)
      line(0, toSY(y), R.width, toSY(y), Math.round(y / step) % 5 === 0 ? "c" : "f");

    // origin
    if (0 > x0 && 0 < x1) line(toSX(0), 0, toSX(0), R.height, "c");
    if (0 > y0 && 0 < y1) line(0, toSY(0), R.width, toSY(0), "c");
  }

  // ---------- text overlay (annotations, screen space) ----------

  function drawOverlay() {
    overlay.textContent = "";
    if (!state.opts.annotations || !state.vm.annotations) return;
    const { tx, ty, s } = state.view;
    for (const a of state.vm.annotations) {
      if (!a.text) continue;
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", tx + s * a.position[0]);
      t.setAttribute("y", ty - s * a.position[1]);
      t.setAttribute("font-size", 11);
      if (a.rotation) t.setAttribute("transform",
        `rotate(${-a.rotation} ${tx + s * a.position[0]} ${ty - s * a.position[1]})`);
      t.textContent = a.text;
      overlay.appendChild(t);
    }
  }

  // ---------- tooltip ----------

  const CAP = { outer: "Outer contour", inner: "Inner contour", hole: "Hole",
    countersink: "Countersink", threaded_hole: "Threaded hole",
    bending: "Bend line", engrave: "Engraving", marking: "Marking",
    frame: "Frame", unknown: "Trash / unclassified" };

  function showTip(e) {
    const f = e.currentTarget.__f;
    const c = fix(f.color || "#ff0000");
    const rows = [];
    const add = (k, v) => v !== undefined && v !== "" && v !== null && rows.push(
      `<dt>${k}</dt><dd>${v}</dd>`);
    add("role", f.role);
    if (f.hole_type) add("type", f.hole_type);
    if (f.diameter) add("Ø", f.diameter.toFixed(2) + " mm");
    if (f.outer_diameter) add("Ø outer", f.outer_diameter.toFixed(2) + " mm");
    if (f.center) add("center", f.center.map(n => n.toFixed(1)).join(", "));
    if (f.length) add("length", f.length.toFixed(2) + " mm");
    if (f.angle_deg !== undefined) add("angle", f.angle_deg.toFixed(1) + "°");
    if (f.source) add("source", f.source);
    if (f.confidence !== undefined) add("conf", f.confidence.toFixed(2));
    add("verts", (f.points || []).length || undefined);

    tip.style.setProperty("--tipc", c);
    tip.innerHTML =
      `<div class="k"><span class="swatch" style="background:${c}"></span>` +
      `${CAP[f.role] || f.role || "?"}${f.tag ? `<span style="color:var(--ink-faint);font-weight:600"> ${f.tag}</span>` : ""}</div>` +
      `<dl>${rows.join("")}</dl>`;
    tip.classList.add("show");
    moveTip(e);
  }
  function moveTip(e) {
    const R = stage.getBoundingClientRect();
    let x = e.clientX - R.left + 14, y = e.clientY - R.top + 14;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > R.width - 8) x = e.clientX - R.left - tw - 14;
    if (y + th > R.height - 8) y = e.clientY - R.top - th - 14;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  function hideTip() { tip.classList.remove("show"); }
  svg.addEventListener("pointermove", e => { if (tip.classList.contains("show")) moveTip(e); });

  // ---------- panels ----------

  function renderPanels() {
    const vm = state.vm;

    // samples
    const sc = el("samples"); sc.textContent = "";
    Object.keys(SAMPLES).forEach(name => {
      const b = document.createElement("button");
      b.textContent = name;
      b.className = name === state.name ? "on" : "";
      b.onclick = () => load(name, SAMPLES[name]);
      sc.appendChild(b);
    });

    // parts
    const pc = el("parts"); pc.textContent = "";
    if (vm.parts.length > 1) {
      ["all", ...vm.parts.map((_, i) => String(i))].forEach(k => {
        const b = document.createElement("button");
        b.textContent = k === "all" ? "all" : (vm.parts[+k].label || "P" + k);
        b.className = k === state.part ? "on" : "";
        b.onclick = () => { state.part = k; buildScene(); fit(); renderPanels(); };
        pc.appendChild(b);
      });
    }

    // layer toggles
    const counts = {};
    for (const f of features(vm)) counts[f.role || "unknown"] = (counts[f.role || "unknown"] || 0) + 1;
    const lc = el("layers"); lc.textContent = "";
    const roles = Object.keys(counts).sort((a, b) => ROLE_ORDER.indexOf(a) - ROLE_ORDER.indexOf(b));
    if (!roles.length) lc.innerHTML = `<div class="stats" style="color:var(--ink-faint)">no geometry</div>`;
    roles.forEach(role => {
      const color = fix((vm.palette && vm.palette[role]) || roleColor(vm, role));
      const on = !state.hidden.has(role);
      const b = document.createElement("button");
      b.className = "toggle";
      b.setAttribute("aria-pressed", on);
      b.innerHTML =
        `<span class="swatch" style="background:${color}"></span>` +
        `<span class="name">${(CAP[role] || role)}</span>` +
        `<span class="count">${counts[role]}</span>`;
      b.onclick = () => {
        state.hidden.has(role) ? state.hidden.delete(role) : state.hidden.add(role);
        const g = scene.querySelector(`[data-role="${role}"]`);
        if (g) g.style.display = state.hidden.has(role) ? "none" : "";
        b.setAttribute("aria-pressed", !state.hidden.has(role));
      };
      lc.appendChild(b);
    });

    // display toggles
    const check = `<span class="box"><svg viewBox="0 0 10 10"><path d="M1 5l3 3 5-6"/></svg></span>`;
    const dc = el("display"); dc.textContent = "";
    const DISP = [
      ["trash", "Trash geometry", (vm.trash || []).length],
      ["annotations", "Annotation text", (vm.annotations || []).length],
      ["circles", "Holes as circles", null],
      ["grid", "Reference grid", null],
    ];
    DISP.forEach(([key, name, n]) => {
      const on = state.opts[key];
      const b = document.createElement("button");
      b.className = "toggle";
      b.setAttribute("aria-pressed", on);
      b.innerHTML = (on ? check : `<span class="box" style="background:none"></span>`) +
        `<span class="name">${name}</span>` +
        (n != null ? `<span class="count">${n}</span>` : "");
      b.onclick = () => {
        state.opts[key] = !state.opts[key];
        buildScene();
        renderPanels();
      };
      dc.appendChild(b);
    });

    // stats
    const bb = vm.bbox;
    const totalArea = vm.parts.reduce((s, p) => s + (p.area || 0), 0);
    const s = el("stats"); s.textContent = "";
    const row = (k, v, cls) => {
      const d = document.createElement("div");
      d.innerHTML = `<span>${k}</span><span class="${cls || ""}">${v}</span>`;
      s.appendChild(d);
    };
    row("parts", vm.part_count ?? vm.parts.length);
    row("valid", vm.is_valid ? "true" : "false", vm.is_valid ? "" : "err");
    if (bb) { row("width", (bb[2] - bb[0]).toFixed(1) + " mm"); row("height", (bb[3] - bb[1]).toFixed(1) + " mm"); }
    row("net area", totalArea ? totalArea.toFixed(0) + " mm²" : "—");
    row("trash", (vm.trash || []).length);
    row("annotations", (vm.annotations || []).length);
    if (vm.warnings && vm.warnings.length) row("warnings", vm.warnings.length, "warn");
    if (vm.errors && vm.errors.length) row("errors", vm.errors.length, "err");
  }

  function roleColor(vm, role) {
    for (const p of vm.parts) {
      if (p.outer && p.outer.role === role) return p.outer.color;
      for (const grp of [p.inners, p.holes, p.bending_lines, p.engrave_lines])
        for (const f of grp) if (f.role === role) return f.color;
    }
    return "#ff0000";
  }

  // ---------- load ----------

  function load(name, vm) {
    if (!vm || !Array.isArray(vm.parts)) throw new Error("not a view model — missing 'parts' array");
    state.name = name;
    state.vm = vm;
    state.hidden.clear();
    state.part = "all";
    el("file").textContent = vm.source_file || name || "—";
    buildScene();
    renderPanels();
    fit();
  }

  // ---------- interaction ----------

  let drag = null;
  svg.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY, tx: state.view.tx, ty: state.view.ty };
    svg.classList.add("drag");
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e => {
    const R = svg.getBoundingClientRect();
    const px = e.clientX - R.left, py = e.clientY - R.top;
    const mx = (px - state.view.tx) / state.view.s;
    const my = (state.view.ty - py) / state.view.s;
    coords.innerHTML = `x&nbsp;<b>${mx.toFixed(2)}</b>&nbsp;&nbsp;y&nbsp;<b>${my.toFixed(2)}</b>`;
    if (drag) {
      state.view.tx = drag.tx + (e.clientX - drag.x);
      state.view.ty = drag.ty + (e.clientY - drag.y);
      applyView();
    }
  });
  const endDrag = e => { drag = null; svg.classList.remove("drag"); };
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const R = svg.getBoundingClientRect();
    zoomAt(e.clientX - R.left, e.clientY - R.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  svg.addEventListener("dblclick", fit);
  el("fit").addEventListener("click", fit);
  addEventListener("keydown", e => {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.key === "f" || e.key === "F") fit();
  });

  // The artifact frame often has no final size when the script first runs, and
  // can resize afterwards (panel drag, window). Keep the view sensible through
  // all of it: fit once we actually have a canvas, re-apply the grid on resize.
  new ResizeObserver(() => {
    if (!fitted) fit();
    else applyView();
  }).observe(stage);

  // ---------- paste / drop ----------

  const sheet = el("sheet");
  el("paste").onclick = () => { sheet.classList.add("open"); el("json").focus(); };
  el("cancel").onclick = () => { sheet.classList.remove("open"); el("msg").textContent = ""; };
  el("load").onclick = () => {
    try {
      const vm = JSON.parse(el("json").value);
      load("pasted", vm);
      sheet.classList.remove("open");
      el("msg").textContent = "";
    } catch (err) { el("msg").textContent = String(err.message || err); }
  };

  ["dragover", "drop"].forEach(t => stage.addEventListener(t, e => e.preventDefault()));
  stage.addEventListener("drop", e => {
    const file = e.dataTransfer.files[0];
    if (!file) return;
    file.text().then(txt => {
      try { load(file.name, JSON.parse(txt)); }
      catch (err) { el("msg").textContent = String(err.message || err); sheet.classList.add("open"); }
    });
  });

  // ---------- go ----------
  const first = Object.keys(SAMPLES)[0];
  load(first, SAMPLES[first]);
})();
</script>
