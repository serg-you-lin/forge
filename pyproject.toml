[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
# Unica fonte di verità della versione. forge.__version__ la legge da qui via
# importlib.metadata — non duplicarla nel codice (MAP.md D11).
version = "0.6.2"
description = "DXF geometry preprocessing for manufacturing pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Federico Sidraschi" }
]
keywords = ["dxf", "cad", "manufacturing", "geometry", "nesting", "cam", "laser cut"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ezdxf>=1.1",
    "shapely>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
raster = ["opencv-python", "Pillow"]
pdf    = ["PyMuPDF"]
dev    = ["pytest", "pytest-cov"]
all    = ["forge[raster,pdf]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]