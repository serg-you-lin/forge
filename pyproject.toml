[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf-forge"
version = "1.0.0"
description = "DXF geometry preprocessing for manufacturing pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Federico Sidraschi" }
]
keywords = ["dxf", "cad", "manufacturing", "geometry", "nesting", "cam", "laser cut"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ezdxf>=1.1",
    "shapely>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
snapmark = ["snapmark"]   # opzionale: solo se si usa con snapmark
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dxf_forge*"]
