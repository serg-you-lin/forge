[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
# Unica fonte di verità della versione. forge.__version__ la legge da qui via
# importlib.metadata — non duplicarla nel codice (MAP.md D11).
version = "0.10.0"
description = "Deterministic 2D-geometry engine for technical drawings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [
    { name = "Federico Sidraschi" }
]
keywords = ["cad", "geometry", "technical-drawing", "dxf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ezdxf>=1.1",
    "shapely>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
raster = ["opencv-python", "Pillow"]
pdf    = ["PyMuPDF"]
dev    = ["pytest", "pytest-cov"]
all    = ["forge[raster,pdf]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]

# Regola di dipendenza controllata da scripts/gen_index.py (MAP.md D44)
[tool.gen_index.layers]
core  = ["adapters", "tools", "io"]
model = ["adapters", "tools", "io"]

[tool.pytest.ini_options]
testpaths = ["tests"]